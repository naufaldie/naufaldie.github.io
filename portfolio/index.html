<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>Portfolio</title>


    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #0D0D0D;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .content {
            width: min(1200px, 90%);
            margin: 0 auto;
            padding: 40px 0 60px;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 30px;
        }

        .pdf-container {
            width: 100%;
            height: 80vh;
            background-color: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <main class="content">
        <h1>Portfolio</h1>
        <div class="pdf-container">
            <iframe
                src="https://drive.google.com/file/d/13AmDdu8k5Y07_go_NPqJRqx2_2f71p8M/preview"
                title="Portfolio PDF">
            </iframe>
        </div>
    </main>
</body>
</html>
