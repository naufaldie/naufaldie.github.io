<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Naufaldie</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #0D0D0D;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .content {
            width: min(500px, 85%);
        }

        h1 {
            margin: 0;
            font-size: 64px;
        }

        .role {
            margin: 0 0 40px;
            color: #A0A0A0;
            font-size: 24px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .links a {
            color: white;
            font-size: 24px;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .links a:hover {
            color: #800020;
        }

        .signature {
            margin-top: 50px;
            color: #800020;
            font-size: 28px;
            font-style: italic;
            text-align: right;
        }
    </style>
</head>

<body>
    <main class="content">

        <h1>Naufaldie</h1>
        <p class="role">Flutter Mobile Engineer</p>

        <nav class="links">
            <a href="portfolio/">Portfolio</a>
            <a href="https://www.linkedin.com/in/naufaldie/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://docs.google.com/document/d/1Kgorh_48jWgSX1aVb6ye3yoq4P5kbbvQ2XiuBuA2Zwk/preview" target="_blank" rel="noopener noreferrer">Resume</a>
        </nav>

        <div class="signature">- R.NA / 2026</div>

    </main>
</body>
</html>
